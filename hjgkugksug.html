<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rail Break: Cross-Platform Pro</title>
    <style>
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; outline: none; }
        body { margin: 0; overflow: hidden; background: #87ceeb; touch-action: none; font-family: sans-serif; }
        #ui { position: absolute; top: 15px; left: 15px; color: #000; z-index: 100; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 8px; border: 2px solid #2e7d32; pointer-events: none; }
        #joy-base { position: absolute; bottom: 40px; left: 40px; width: 110px; height: 110px; background: rgba(0,0,0,0.1); border-radius: 50%; border: 2px solid #333; z-index: 200; }
        #joy-knob { position: absolute; top: 30px; left: 30px; width: 50px; height: 50px; background: #333; border-radius: 50%; }
        #btn-mine { position: absolute; bottom: 30px; right: 30px; width: 90px; height: 90px; background: #2e7d32; border: 4px solid #fff; border-radius: 50%; color: #fff; font-weight: bold; z-index: 200; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: pointer; }
        #btn-shop { position: absolute; top: 15px; right: 15px; width: 60px; height: 60px; background: #fbc02d; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 200; cursor: pointer; }
        #msg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; text-align: center; }
        #warning { position: absolute; top: 15%; width: 100%; text-align: center; color: #d32f2f; font-weight: bold; display: none; z-index: 50; font-size: 20px; text-shadow: 1px 1px #fff; }
        #pc-hint { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 12px; color: #333; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">🌿 RAU MÁ: <span id="herb">0</span><br>🚂 TÀU ĐẾN: <span id="chance">0</span>%</div>
    <div id="warning">⚠️ NAPOLEON ĐANG ĐẾN!</div>
    <div id="btn-shop">SHOP (E)</div>
    <div id="btn-mine">ĐẬP (Space)</div>
    <div id="joy-base"><div id="joy-knob"></div></div>
    <div id="pc-hint">PC: WASD để đi - Chuột để xoay - Click để Đập</div>
    <div id="msg"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // --- MAP & MODELS (GIỮ NGUYÊN) ---
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 500), new THREE.MeshStandardMaterial({color: 0x558b2f}));
        ground.rotation.x = -Math.PI/2;
        scene.add(ground);

        for(let i = 0; i < 150; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2), new THREE.MeshStandardMaterial({color: 0x3e2723}));
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.2, 3, 6), new THREE.MeshStandardMaterial({color: 0x1b5e20}));
            leaves.position.y = 2; tree.add(trunk, leaves);
            const side = Math.random() > 0.5 ? 1 : -1;
            tree.position.set(side * (12 + Math.random()*10), 1, (Math.random()-0.5)*200);
            scene.add(tree);
        }

        const rails = [];
        for(let i = -150; i < 150; i++) {
            const s = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 0.5), new THREE.MeshStandardMaterial({color: 0x211100}));
            s.position.set(0, 0.1, i);
            const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.2, 1), new THREE.MeshStandardMaterial({color: 0x666666}));
            r1.position.set(-0.75, 0.25, i);
            const r2 = r1.clone(); r2.position.set(0.75, 0.25, i);
            const g = new THREE.Group(); g.add(s, r1, r2);
            scene.add(g);
            rails.push({z: i, mesh: g, broken: false});
        }

        const napo = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2, 0.8), new THREE.MeshStandardMaterial({color: 0x0d47a1}));
        napo.position.set(20, 1, 0);
        scene.add(napo);

        // --- HỆ THỐNG ĐIỀU KHIỂN MIX (PC + MOBILE) ---
        let herb = 0, chance = 0, isGameOver = false, mining = false;
        let lon = -90, lat = 0;
        let joyId = null, lookId = null;
        let lastLookX, lastLookY;
        const joyMove = new THREE.Vector2(); // Dùng chung cho cả phím và joystick
        const keys = { w: false, a: false, s: false, d: false };
        const clock = new THREE.Clock();

        // 1. Logic PC: Chuột & Bàn phím
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                lon += e.movementX * 0.1;
                lat = Math.max(-85, Math.min(85, lat - e.movementY * 0.1));
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') mining = true;
            if (e.code === 'KeyE') toggleShop(); // Giả định có hàm toggleShop
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') mining = false;
        });

        // 2. Logic Mobile: Touch (GIỮ NGUYÊN)
        window.addEventListener('touchstart', (e) => {
            for(let t of e.changedTouches) {
                if(t.clientX < window.innerWidth/2 && joyId === null) joyId = t.identifier;
                else if(t.clientX >= window.innerWidth/2 && lookId === null) {
                    lookId = t.identifier; lastLookX = t.clientX; lastLookY = t.clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for(let t of e.touches) {
                if(t.identifier === joyId) {
                    const r = document.getElementById('joy-base').getBoundingClientRect();
                    const dx = t.clientX - (r.left + 55), dy = t.clientY - (r.top + 55);
                    const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
                    const ang = Math.atan2(dy, dx);
                    joyMove.set(Math.cos(ang)*(dist/50), Math.sin(ang)*(dist/50));
                    document.getElementById('joy-knob').style.transform = `translate(${joyMove.x*35}px, ${joyMove.y*35}px)`;
                } else if(t.identifier === lookId) {
                    lon += (t.clientX - lastLookX) * 0.25;
                    lat = Math.max(-85, Math.min(85, lat - (t.clientY - lastLookY)*0.25));
                    lastLookX = t.clientX; lastLookY = t.clientY;
                }
            }
        }, {passive: false});

        window.addEventListener('touchend', (e) => {
            for(let t of e.changedTouches) {
                if(t.identifier === joyId) { joyId = null; joyMove.set(0,0); document.getElementById('joy-knob').style.transform = 'none'; }
                if(t.identifier === lookId) lookId = null;
            }
        });

        // Nút Đập (Hỗ trợ cả chuột và cảm ứng)
        const mineBtn = document.getElementById('btn-mine');
        mineBtn.addEventListener('mousedown', () => mining = true);
        mineBtn.addEventListener('mouseup', () => mining = false);
        mineBtn.addEventListener('touchstart', (e) => { mining = true; e.stopPropagation(); });
        mineBtn.addEventListener('touchend', () => mining = false);

        // --- GAMEPLAY LOOP (CẬP NHẬT ĐỂ NHẬN CẢ PHÍM) ---
        camera.position.set(2, 1.7, 5);

        function animate() {
            if(isGameOver) return;
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // Camera Rotation
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            const target = new THREE.Vector3(Math.sin(phi)*Math.cos(theta), Math.cos(phi), Math.sin(phi)*Math.sin(theta));
            camera.lookAt(camera.position.clone().add(target));

            // Movement Logic (Kết hợp PC keys + Mobile Joystick)
            let moveX = joyMove.x;
            let moveY = joyMove.y;
            if (keys.w) moveY = -1;
            if (keys.s) moveY = 1;
            if (keys.a) moveX = -1;
            if (keys.d) moveX = 1;

            if(Math.abs(moveX) > 0.05 || Math.abs(moveY) > 0.05) {
                const f = new THREE.Vector3(target.x, 0, target.z).normalize();
                const r = new THREE.Vector3().crossVectors(f, new THREE.Vector3(0,1,0)).normalize();
                camera.position.add(f.multiplyScalar(-moveY * 6 * dt));
                camera.position.add(r.multiplyScalar(moveX * 6 * dt));
                camera.position.x = Math.max(-11, Math.min(11, camera.position.x));
            }

            // Tàu & Phá ray (GIỮ NGUYÊN LOGIC CŨ)
            chance += 1.6 * dt;
            document.getElementById('chance').innerText = Math.floor(chance);
            if(chance >= 100) { chance = 0; spawnTrain(); }

            if(mining && Math.abs(camera.position.x) < 1.5) {
                const ray = rails.find(ra => !ra.broken && Math.abs(ra.z - camera.position.z) < 0.8);
                if(ray) {
                    herb += 8 * dt;
                    if(herb % 5 < 0.2) {
                        ray.broken = true;
                        ray.mesh.rotation.z = 0.2;
                        ray.mesh.position.y -= 0.1;
                        ray.mesh.children.forEach(c => c.material.color.set(0x3e2723));
                    }
                }
                document.getElementById('herb').innerText = Math.floor(herb);
            }
            renderer.render(scene, camera);
        }

        // --- SPAWN TÀU & NỔ CHẬM (GIỮ NGUYÊN) ---
        function spawnTrain() {
            const train = new THREE.Group();
            for(let i=0; i<15; i++) {
                const s = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 0.9), new THREE.MeshStandardMaterial({color: 0x111111, metalness: 0.8}));
                s.position.z = i * 1.0; train.add(s);
            }
            train.position.set(0, 1.2, -120);
            scene.add(train);

            let exploded = false;
            const moveTrain = () => {
                if(isGameOver || exploded) return;
                train.position.z += 0.7;
                const hit = rails.find(r => r.broken && Math.abs(r.z - train.position.z) < 1.5);
                if(hit) {
                    exploded = true;
                    let startTime = performance.now();
                    const shake = (now) => {
                        const elapsed = now - startTime;
                        train.position.x = Math.sin(elapsed * 0.1) * 0.2;
                        if(elapsed < 1500) requestAnimationFrame(shake);
                        else {
                            train.children.forEach(c => c.material.color.set(0xff0000));
                            setTimeout(() => { endGame(true); }, 3000);
                        }
                    };
                    requestAnimationFrame(shake);
                } else if(train.position.z < 120) requestAnimationFrame(moveTrain);
                else scene.remove(train);
            };
            moveTrain();
        }

        function endGame(win) {
            isGameOver = true;
            document.exitPointerLock();
            document.getElementById('msg').style.display = 'flex';
            document.getElementById('msg').innerHTML = `<h1>${win ? "CHIẾN THẮNG" : "THẤT BẠI"}</h1><button onclick="location.reload()">CHƠI LẠI</button>`;
        }
        function toggleShop() { console.log("Shop opened"); } // Placeholder

        animate();
    </script>
</body>
</html>
